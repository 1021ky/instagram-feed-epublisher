name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - parallel:
          - name: Lint code
            run: pnpm lint

          - name: Lint markdown
            run: pnpm lint:md

          - name: Format check
            run: pnpm format:check

          - name: Type check
            run: pnpm --filter instagram-feed-epublisher-webapp exec tsc --noEmit

          - name: Check Mermaid diagrams
            run: pnpm check:mermaid
            env:
              PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

          - name: Unit tests
            run: pnpm test
